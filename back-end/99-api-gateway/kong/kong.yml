_format_version: "3.0"
_transform: true

# Kong DB-less - FaceAttend EDU - ADR-007 + ADR-005
services:
  # Credential endpoints (login, its second factor and password recovery): no
  # session yet, so they get a tighter per-IP limit than the rest of identity.
  # Kept above the school-NAT case (a class signing in from one public IP);
  # identity adds its own per-account and per-IP lockout on top.
  - name: identity-credentials-service
    url: http://ms-identity:8081
    routes:
      - name: identity-credentials-route
        paths: [/api/v1/auth/login, /api/v1/auth/forgot-password, /api/v1/auth/verify-code, /api/v1/auth/reset-password]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins: ["__CORS_ORIGINS__"]
          methods: [POST, OPTIONS]
          headers: [Authorization, Content-Type]
          credentials: true
      - name: rate-limiting
        config:
          minute: 60
          hour: 600
          fault_tolerant: true
          redis_host: redis
          redis_port: 6379
          redis_database: 0
          policy: redis
  - name: identity-service
    url: http://ms-identity:8081
    routes:
      - name: identity-route
        paths: [/api/v1/persons, /api/v1/users, /api/v1/auth, /api/v1/sessions, /api/v1/password-policies]
        strip_path: false
      # Canonical school lives in academic-service; identity SchoolController kept direct-only for backward compat
      - name: identity-nested-route
        paths: ["~/api/v1/users/.+/activate"]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins: ["__CORS_ORIGINS__"]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type]
          credentials: true
      - name: rate-limiting
        config:
          minute: 6000 # dev: límite holgado para la carga de las pantallas (ver docs de gateway)
          fault_tolerant: true
          redis_host: redis
          redis_port: 6379
          redis_database: 0
          policy: redis
  # Alta pública de sede + administrador: sin sesión previa, por eso va aparte con
  # un límite estricto por IP (el resto de identity usa un límite holgado).
  - name: onboarding-service
    url: http://ms-identity:8081
    routes:
      - name: onboarding-route
        paths: [/api/v1/onboarding]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins: ["__CORS_ORIGINS__"]
          methods: [POST, OPTIONS]
          headers: [Content-Type]
      - name: rate-limiting
        config:
          minute: 5
          hour: 20
          fault_tolerant: true
          redis_host: redis
          redis_port: 6379
          redis_database: 0
          policy: redis
  - name: authorization-service
    url: http://ms-authorization:8082
    routes:
      - name: authorization-route
        paths: [/api/v1/roles, /api/v1/permissions, /api/v1/user-roles]
        strip_path: false
      - name: authorization-nested-route
        paths: ["~/api/v1/users/.+/roles", /api/v1/auth/evaluate]
        strip_path: false
    plugins:
      # JWT retirado: AuthTokenFilter valida sesión + evaluate en el MS.
      - name: rate-limiting
        config:
          minute: 6000 # dev: límite holgado para la carga de las pantallas (ver docs de gateway)
          fault_tolerant: true
          redis_host: redis
          redis_port: 6379
          redis_database: 0
          policy: redis
  - name: academic-service
    url: http://ms-academic:8083
    routes:
      - name: academic-route
        paths: [/api/v1/schools, /api/v1/programs, /api/v1/academic-periods, /api/v1/periods, /api/v1/cohorts, /api/v1/courses, /api/v1/actor-types, /api/v1/academic-actors, /api/v1/enrollments]
        strip_path: false
    # Sin plugins propios: el enforcement lo hace el MS (ver scheduling-nested-route).
  - name: scheduling-service
    url: http://ms-scheduling:8084
    routes:
      - name: scheduling-route
        paths: [/api/v1/environments, /api/v1/schedule-blocks, /api/v1/class-sessions]
        strip_path: false
      - name: scheduling-nested-route
        paths: ["~/api/v1/cohorts/.+/blocks", "~/api/v1/environments/.+/blocks", "~/api/v1/actors/.+/blocks", "~/api/v1/blocks/.+/sessions"]
        strip_path: false
    # Sin plugins propios: el enforcement lo hace AuthTokenFilter en cada MS
    # (la sesión opaca no es JWT; reintroducir jwt con RS256 según ADR-007).
  - name: attendance-service
    url: http://ms-attendance:8085
    routes:
      - name: attendance-route
        paths: [/api/v1/attendance-records, /api/v1/attendance-reports, /api/v1/justifications, /api/v1/justification-types, /api/v1/supporting-documents]
        strip_path: false
      - name: attendance-nested-route
        paths: ["~/api/v1/class-sessions/.+/attendance", "~/api/v1/academic-actors/.+/attendance", "~/api/v1/attendance/.+/justification", "~/api/v1/justifications/.+/documents"]
        strip_path: false
    plugins:
      # JWT retirado: AuthTokenFilter valida sesión + evaluate en el MS.
      - name: rate-limiting
        config:
          minute: 6000 # dev: límite holgado para la carga de las pantallas (ver docs de gateway)
          fault_tolerant: true
          redis_host: redis
          redis_port: 6379
          redis_database: 0
          policy: redis
      # Supporting documents: 5 MB file plus the multipart envelope (ms-attendance enforces 5 MB).
      - name: request-size-limiting
        config:
          allowed_payload_size: 6
          size_unit: megabytes
  # Incluye registro/reconocimiento facial y de huella (rostro -> encoding vía
  # dlib, huella -> keypoints OpenCV), fusionado desde el antiguo face-auth-api;
  # read_timeout elevado por el costo de ese cómputo en /enroll-image,
  # /identify-image, /enroll-sample e /identify-sample.
  - name: biometric-service
    url: http://ms-biometric:8086
    read_timeout: 60000
    routes:
      - name: biometric-route
        paths: [/api/v1/biometric]
        strip_path: false
    # El enforcement lo hace el MS (require_permission). Base64 frames of up to
    # BIOMETRIC_MAX_IMAGE_BYTES (3 MB decoded, ~4 MB encoded) and the liveness
    # step's few frames fit in 12 MB; nothing bigger reaches the decoder.
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 12
          size_unit: megabytes
  - name: configuration-service
    url: http://ms-configuration:8087
    routes:
      - name: configuration-route
        paths: [/api/v1/academic-configurations, /api/v1/security-configurations, /api/v1/biometric-update-cases, /api/v1/configurations]
        strip_path: false
      - name: configuration-nested-route
        paths: ["~/api/v1/schools/.+/configurations", "~/api/v1/persons/.+/biometric-cases"]
        strip_path: false
    # Sin plugins propios: el enforcement lo hace el MS.
  - name: notification-service
    url: http://ms-notification:8088
    routes:
      - name: notification-route
        paths: [/api/v1/alert-types, /api/v1/alerts, /api/v1/device-tokens]
        strip_path: false
    # Sin plugins propios: el enforcement lo hace el MS.
  # /health/quality (informe ISO 9001 de cada servicio) ya no se publica en Internet:
  # solo se consulta dentro de la red Docker o por el puerto local de cada servicio.
  # ── Quality Service (ISO 25010/29110) ──────────────────────
  - name: quality-service
    url: http://ms-quality:8089
    routes:
      - name: quality-route
        paths: [/api/v1/quality]
        strip_path: false
    plugins:
      # JWT retirado: el enforcement vive en cada MS.
      - name: rate-limiting
        config:
          minute: 6000 # dev: límite holgado para la carga de las pantallas (ver docs de gateway)
          fault_tolerant: true
          redis_host: redis
          redis_port: 6379
          redis_database: 0
          policy: redis
# No consumers here: the jwt plugin is not enabled (only rate-limiting and
# cors are), and Kong cannot interpolate env vars in declarative config, so a
# committed secret would be the only way to keep one. Provision RS256 keys
# through the Admin API when jwt is enabled (ADR-007: identity-service).
# TLS termination (production): mount cert/key and uncomment:
# certificates:
#   - cert: /kong/ssl/faceattend.crt
#     key: /kong/ssl/faceattend.key
#     snis: ["api.faceattend.local"]
plugins:
  # Edge authentication: the bearer is an opaque session UUID, so it is checked
  # against identity (GET /sessions/{id}) instead of a JWT signature. Mirrors the
  # public paths of each MS AuthTokenFilter; permissions are still evaluated there.
  # Needs KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES=resty.http on the gateway.
  # post-function (not pre-function): it runs after rate-limiting and
  # request-size-limiting, so a flood of made-up tokens is counted and cut at
  # the limit instead of reaching identity once per request.
  - name: post-function
    config:
      access:
        - |
          local method = kong.request.get_method()
          if method == "OPTIONS" then return end

          local path = kong.request.get_path()
          local public_prefixes = { "/health", "/api/v1/health", "/api/health" }
          for _, prefix in ipairs(public_prefixes) do
            if path:sub(1, #prefix) == prefix then return end
          end
          local public_posts = {
            ["/api/v1/auth/login"] = true, ["/api/v1/auth/login/verify"] = true, ["/api/v1/auth/logout"] = true,
            ["/api/v1/auth/refresh"] = true, ["/api/v1/auth/forgot-password"] = true,
            ["/api/v1/auth/verify-code"] = true, ["/api/v1/auth/reset-password"] = true,
            -- Alta pública de sede + administrador (identity la protege con
            -- validación, cuenta de servicio y el límite por IP de su ruta).
            ["/api/v1/onboarding/schools"] = true,
          }
          if method == "POST" and public_posts[path] then
            -- Logout: invalida la entrada cacheada para que el token
            -- deje de pasar el edge de inmediato (los servicios conservan
            -- su ventana de 10 s).
            if path == "/api/v1/auth/logout" then
              pcall(function()
                local args = kong.request.get_query()
                local sid = args and args.sessionId
                if type(sid) == "string" and #sid > 0 then
                  kong.cache:invalidate("faceattend:session:" .. sid)
                end
              end)
            end
            return
          end

          local header = kong.request.get_header("authorization")
          local token = header and header:match("^[Bb]earer%s+(%S+)$")
          -- El navegador no puede poner cabeceras en el handshake de un
          -- WebSocket: el kiosco manda la sesión como subprotocolo
          -- ("faceattend.bearer, <token>"), nunca en la URL, que quedaría en
          -- los logs de acceso. Solo el canal biométrico lo admite (el MS lo
          -- valida igual); el resto de rutas exige la cabecera Authorization.
          if not token and method == "GET" and path == "/api/v1/biometric/ws" then
            local protocols = kong.request.get_header("sec-websocket-protocol")
            token = protocols and protocols:match("^%s*faceattend%.bearer%s*,%s*([%x%-]+)%s*$")
          end
          if not token or not token:match("^%x%x%x%x%x%x%x%x%-%x%x%x%x%-%x%x%x%x%-%x%x%x%x%-%x%x%x%x%x%x%x%x%x%x%x%x$") then
            return kong.response.exit(401, { status = 401, error = "Unauthorized", message = "Missing or invalid bearer token", path = path })
          end

          -- Cuenta con la contraseña inicial (mustChangePassword): solo puede
          -- leer (la web carga roles y perfil al entrar) y cambiar la clave.
          -- El cambio de clave invalida la entrada cacheada de la sesión.
          local function enforce_password_change(must_change)
            if path == "/api/v1/auth/change-password" then
              pcall(function() kong.cache:invalidate("faceattend:session:" .. token) end)
              return
            end
            if must_change and method ~= "GET" then
              return kong.response.exit(403, { status = 403, error = "Forbidden", code = "PASSWORD_CHANGE_REQUIRED", message = "Change your initial password to continue", path = path })
            end
          end

          -- "active" / "must_change" (10 s) or "invalid" (5 s, so a flood of
          -- made-up tokens does not reach identity once per request). An
          -- unreachable or failing identity returns an error: never cached,
          -- the next request asks again (fail-secure 503).
          local function lookup()
            local httpc = require("resty.http").new()
            httpc:set_timeouts(2000, 2000, 3000)
            local res, err = httpc:request_uri("http://ms-identity:8081/api/v1/sessions/" .. token, {
              method = "GET",
              headers = { Authorization = "Bearer " .. token },
            })
            if not res then return nil, err or "identity unreachable" end
            if res.status >= 500 then return nil, "identity answered " .. res.status end
            if res.status ~= 200 or not res.body or not res.body:find('"sessionStatus"%s*:%s*"Active"') then
              return "invalid", nil, 5
            end
            if res.body:find('"mustChangePassword"%s*:%s*true') then return "must_change", nil, 10 end
            return "active", nil, 10
          end

          -- Revocation/logout window: 10 s (logout and change-password
          -- invalidate the entry right away).
          local state = kong.cache:get("faceattend:session:" .. token, { ttl = 10 }, lookup)
          if not state then
            return kong.response.exit(503, { status = 503, error = "Service Unavailable", message = "Cannot verify session", path = path })
          end
          if state == "invalid" then
            return kong.response.exit(401, { status = 401, error = "Unauthorized", message = "Invalid or expired session", path = path })
          end
          return enforce_password_change(state == "must_change")
  - name: cors
    config:
      # Solo los orígenes de KONG_CORS_ORIGINS (el compose los inserta en
      # lugar de __CORS_ORIGINS__ al arrancar). Un Origin ajeno no recibe
      # Access-Control-Allow-Origin. Las apps móviles nativas no envían Origin.
      origins: ["__CORS_ORIGINS__"]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Requested-With]
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 6000 # dev: límite holgado para la carga de las pantallas (ver docs de gateway)
      fault_tolerant: true
      redis_host: redis
      redis_port: 6379
      redis_database: 0
      policy: redis
  # Every other route carries JSON only; services with uploads raise it above.
  - name: request-size-limiting
    config:
      allowed_payload_size: 2
      size_unit: megabytes

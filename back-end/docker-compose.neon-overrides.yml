# FaceAttend EDU — overrides para Neon PostgreSQL
# Usado con: docker compose -f docker-compose.prod.yml up
# Redefine los depends_on para NO esperar a un postgres: local,
# y ajusta las conexiones para usar Neon via variables de entorno
# Requiere NEON_HOST: host completo de Neon, con region (p. ej.
# ep-xxxx-pooler.c-2.sa-east-1.aws.neon.tech). Sin la region el nombre no resuelve.

services:
  ms-identity:
    depends_on: !override
      # Quitamos: postgres (service_healthy)
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ms-notification:
        condition: service_started
    environment:
      # Sobrescribe SPRING_DATASOURCE_URL para usar Neon (de .env.prod)
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD}
      SPRING_DATASOURCE_HIKARI_SCHEMA: identity

  ms-authorization:
    depends_on: !override
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD}
      SPRING_DATASOURCE_HIKARI_SCHEMA: authorization

  ms-scheduling:
    depends_on: !override
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD}
      SPRING_DATASOURCE_HIKARI_SCHEMA: scheduling

  ms-attendance:
    depends_on: !override
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD}
      SPRING_DATASOURCE_HIKARI_SCHEMA: attendance

  ms-biometric:
    depends_on: !override
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${NEON_JDBC_URL}
      SPRING_DATASOURCE_USERNAME: ${NEON_USER}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD}
      SPRING_DATASOURCE_HIKARI_SCHEMA: biometric

  # ── Node/TypeScript services ──
  ms-academic:
    depends_on: !override
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${NEON_USER}:${NEON_PASSWORD}@${NEON_HOST:?NEON_HOST is required}/${POSTGRES_DB}?schema=academic&sslmode=require

  ms-configuration:
    depends_on: !override
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${NEON_USER}:${NEON_PASSWORD}@${NEON_HOST:?NEON_HOST is required}/${POSTGRES_DB}?schema=configuration&sslmode=require

  ms-quality:
    depends_on: !override
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${NEON_USER}:${NEON_PASSWORD}@${NEON_HOST:?NEON_HOST is required}/${POSTGRES_DB}?schema=quality&sslmode=require

  # ── Go — ms-notification ──
  ms-notification:
    depends_on: !override
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${NEON_USER}:${NEON_PASSWORD}@${NEON_HOST:?NEON_HOST is required}/${POSTGRES_DB}?schema=notification&sslmode=require

[tool.poetry]
name = "biometric-service"
version = "0.1.0"
description = "FaceAttend EDU Biometric Service — Python FastAPI per ADR-005"
authors = ["FaceAttend EDU Team"]
packages = [{include = "domain"}, {include = "application"}, {include = "infrastructure"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.162.0"
# fastapi accepts any starlette >= 0.46; the floor keeps the patched 1.x line.
starlette = "^1.10.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
motor = "^3.3.0"
pymongo = "^4.6.0"
# headless avoids pulling libGL/X11 into the runtime image (opencv-python does not)
opencv-python-headless = "^4.9.0"
numpy = "^1.26.0"
# Face image -> embedding computation (ported from 10-ms-face-auth); dlib-backed,
# compiles from source — see the Dockerfile builder stage and CI's system_deps.
face-recognition = "^1.3.0"
# face-recognition does NOT pull this in on its own (the model-data package is
# too large for a normal PyPI dependency resolution and must be pinned to its
# git source); without it, `import face_recognition` fails at runtime with
# "Please install face_recognition_models". Confirmed by actually installing
# in a container: pinning this explicitly was required.
face-recognition-models = {git = "https://github.com/ageitgey/face_recognition_models.git"}
# face_recognition_models imports `pkg_resources.resource_filename`, which
# setuptools no longer ships (v81+) and which only the vulnerable older
# setuptools provide. The service root carries a minimal `pkg_resources.py`
# shim built on importlib.resources instead, so setuptools is not a runtime
# dependency at all.
Pillow = "^13.0.0"
python-multipart = "^0.0.32"
structlog = "^24.1.0"
httpx = "^0.28.1"
# CA bundle for every outbound TLS call (httpx); floor at the release that fixes the known advisory.
certifi = ">=2026.10.19"
# AES-256-GCM for biometric data at rest (Ley 1581, infrastructure/security/biometric_cipher.py).
cryptography = "^50.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^0.23.0"
testcontainers = {extras = ["mongodb"], version = "^4.0.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Coverage gate (CI installs pytest-cov and runs pytest --cov=.): measured, rounded down.
[tool.coverage.run]
omit = ["tests/*", "conftest.py", ".venv/*"]

[tool.coverage.report]
fail_under = 74

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Reutilizable desde deploy-production.yml: el despliegue solo corre si CI está verde.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # back-end/shared: the session guard every Java and Node service runs.
  shared-auth:
    name: shared / auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: back-end/shared/auth-java/pom.xml
      - name: mvn test (auth-java)
        working-directory: back-end/shared/auth-java
        run: mvn -B test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --test (auth-node)
        working-directory: back-end/shared/auth-node
        run: npm test
      - name: node --test (node-infra)
        working-directory: back-end/shared/node-infra
        run: npm test

  java-services:
    name: java / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - 01-ms-identity
          - 02-ms-authorization
          - 04-ms-scheduling
          - 05-ms-attendance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            back-end/${{ matrix.service }}/pom.xml
            back-end/shared/auth-java/pom.xml
      - name: install shared auth library
        run: mvn -B -q -f back-end/shared/auth-java/pom.xml install -DskipTests
      # JaCoCo runs in the test phase: the build fails under jacoco.line.minimum (pom.xml).
      - name: mvn test (with coverage gate)
        working-directory: back-end/${{ matrix.service }}
        run: mvn -B test
      - name: coverage summary
        if: always()
        run: python3 .github/scripts/coverage-summary.py jacoco back-end/${{ matrix.service }}/target/site/jacoco/jacoco.csv ${{ matrix.service }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: back-end/${{ matrix.service }}/target/site/jacoco
          if-no-files-found: ignore

  # docs/openapi must match the code: regenerate the Java contracts and fail on any diff.
  openapi:
    name: openapi / drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: back-end/*/pom.xml
      - name: regenerate Java contracts
        run: bash tools/openapi/generate.sh
      - name: contracts match the committed ones
        run: |
          if ! git diff --exit-code -- docs/openapi; then
            echo "::error::docs/openapi is out of date: run tools/openapi/generate.sh and commit the result"
            exit 1
          fi

  node-services:
    name: node / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - 03-ms-academic
          - 07-ms-configuration
          - 08-ms-notification
          - 09-ms-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: back-end/${{ matrix.service }}/package-lock.json
      - name: npm ci
        working-directory: back-end/${{ matrix.service }}
        run: npm ci --ignore-scripts
      # coverageThreshold in jest.config.js fails the job under the service's floor.
      - name: npm test (with coverage gate)
        working-directory: back-end/${{ matrix.service }}
        run: npm test -- --coverage
      - name: coverage summary
        if: always()
        run: python3 .github/scripts/coverage-summary.py jest back-end/${{ matrix.service }}/coverage/coverage-summary.json ${{ matrix.service }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: back-end/${{ matrix.service }}/coverage
          if-no-files-found: ignore
      - name: npm run build
        working-directory: back-end/${{ matrix.service }}
        run: npm run build
      # Informational only: several high-severity findings today are transitive
      # build-tooling deps with no fix available yet. Dependabot (see
      # .github/dependabot.yml) tracks these over time; this step just keeps
      # them visible on every PR without turning CI red for pre-existing debt.
      - name: npm audit (informational)
        working-directory: back-end/${{ matrix.service }}
        run: npm audit --audit-level=high
        continue-on-error: true

  python-services:
    name: python / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: 06-ms-biometric
            system_deps: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system build dependencies
        if: matrix.system_deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libopenblas-dev liblapack-dev
      - name: Install poetry
        run: pip install --no-cache-dir poetry==1.8.3
      # dlib (a face-recognition dependency, merged in from the former
      # 10-ms-face-auth service) compiles from source and takes a long time;
      # cache the venv keyed on the lockfile so only a changed lockfile pays
      # that cost again.
      - name: Cache poetry virtualenv
        uses: actions/cache@v4
        with:
          path: back-end/${{ matrix.service }}/.venv
          key: poetry-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('back-end/{0}/poetry.lock', matrix.service)) }}
      - name: poetry install
        working-directory: back-end/${{ matrix.service }}
        run: poetry config virtualenvs.in-project true && poetry install --no-root
      # pytest-cov is installed here, not locked: fail_under lives in pyproject.toml.
      - name: pytest (with coverage gate)
        working-directory: back-end/${{ matrix.service }}
        run: |
          poetry run pip install --quiet "pytest-cov==5.0.*"
          poetry run pytest --cov=. --cov-report=term --cov-report=json --cov-report=html
      - name: coverage summary
        if: always()
        run: python3 .github/scripts/coverage-summary.py pytest back-end/${{ matrix.service }}/coverage.json ${{ matrix.service }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: back-end/${{ matrix.service }}/htmlcov
          if-no-files-found: ignore
      - name: OpenAPI contract matches the committed one
        working-directory: back-end/${{ matrix.service }}
        run: |
          poetry run python ../../tools/openapi/biometric.py
          if ! git diff --exit-code -- ../../docs/openapi/06-ms-biometric.json; then
            echo "::error::docs/openapi/06-ms-biometric.json is out of date: regenerate it (docs/openapi/README.md)"
            exit 1
          fi
      - name: bandit (informational)
        working-directory: back-end/${{ matrix.service }}
        run: poetry run pip install --quiet bandit && poetry run bandit -r . -x ./tests,./.venv
        continue-on-error: true

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/Mobile/package-lock.json
      - name: npm ci
        working-directory: front-end/Mobile
        run: npm ci --ignore-scripts
      - name: npm test
        working-directory: front-end/Mobile
        run: npm test
      - name: npm audit (informational)
        working-directory: front-end/Mobile
        run: npm audit --audit-level=high
        continue-on-error: true

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/Web/package-lock.json
      - name: npm ci
        working-directory: front-end/Web
        run: npm ci --ignore-scripts
      - name: npm test
        working-directory: front-end/Web
        run: npm test
      - name: expo export --platform web
        working-directory: front-end/Web
        run: npx expo export --platform web
      - name: npm audit (informational)
        working-directory: front-end/Web
        run: npm audit --audit-level=high
        continue-on-error: true

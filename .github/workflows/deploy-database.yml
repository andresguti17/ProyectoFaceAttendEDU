name: Deploy database (Neon)

# Ejecuta las migraciones Liquibase de database/docker-compose.neon.yml contra Neon.
# Reutilizable (workflow_call) desde deploy-production.yml, y manual (workflow_dispatch).
# Liquibase solo hace `update`: nunca `rollback` ni `drop` automáticos.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment que aprueba el despliegue"
        type: string
        default: production
  workflow_dispatch:
    inputs:
      environment:
        description: "Destino del despliegue"
        type: choice
        options: [production]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-database-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: liquibase / neon / ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    env:
      NEON_JDBC_URL: ${{ secrets.NEON_JDBC_URL }}
      NEON_USER: ${{ secrets.NEON_USER }}
      NEON_PASSWORD: ${{ secrets.NEON_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Validar secrets de Neon
        run: |
          for var in NEON_JDBC_URL NEON_USER NEON_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Falta el secret $var en el environment ${{ inputs.environment || 'production' }}"
              exit 1
            fi
          done

      - name: Descargar imágenes de Liquibase
        working-directory: database
        run: docker compose -f docker-compose.neon.yml pull --quiet

      # Liquibase crea databasechangelog sin calificar: si el search_path del usuario
      # apunta a un esquema que no existe (base nueva o esquemas recién borrados),
      # falla con "no schema has been selected to create in". Idempotente.
      - name: Asegurar esquemas base
        run: |
          url="${NEON_JDBC_URL#jdbc:}"
          export PGUSER="$NEON_USER" PGPASSWORD="$NEON_PASSWORD"
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "${url%%\?*}?sslmode=require" -v ON_ERROR_STOP=1 -q <<'SQL'
          CREATE SCHEMA IF NOT EXISTS public;
          CREATE SCHEMA IF NOT EXISTS identity;
          CREATE SCHEMA IF NOT EXISTS "authorization";
          CREATE SCHEMA IF NOT EXISTS academic;
          CREATE SCHEMA IF NOT EXISTS scheduling;
          CREATE SCHEMA IF NOT EXISTS attendance;
          CREATE SCHEMA IF NOT EXISTS biometric;
          CREATE SCHEMA IF NOT EXISTS configuration;
          CREATE SCHEMA IF NOT EXISTS quality;
          CREATE SCHEMA IF NOT EXISTS notification;
          SQL

      # `up` sin flags de abort: los servicios se encadenan con depends_on
      # (service_completed_successfully), así que cada changelog corre en orden.
      # El código de salida real se verifica en el paso siguiente.
      - name: Ejecutar migraciones (update)
        working-directory: database
        run: docker compose -f docker-compose.neon.yml up --no-color

      - name: Verificar que todas las migraciones terminaron bien
        working-directory: database
        run: |
          failed=0
          for id in $(docker compose -f docker-compose.neon.yml ps -aq); do
            name=$(docker inspect -f '{{.Name}}' "$id")
            status=$(docker inspect -f '{{.State.Status}}' "$id")
            code=$(docker inspect -f '{{.State.ExitCode}}' "$id")
            if [ "$status" != "exited" ] || [ "$code" != "0" ]; then
              echo "::error::$name terminó con estado=$status exit=$code"
              failed=1
            else
              echo "OK $name"
            fi
          done
          exit $failed

      # Un usuario por microservicio, miembro del rol de su esquema (03-dcl): cada
      # servicio solo puede leer y escribir su propio esquema. Idempotente.
      - name: Usuarios de base de datos por servicio
        env:
          IDENTITY_DB_PASSWORD: ${{ secrets.IDENTITY_DB_PASSWORD }}
          AUTHORIZATION_DB_PASSWORD: ${{ secrets.AUTHORIZATION_DB_PASSWORD }}
          ACADEMIC_DB_PASSWORD: ${{ secrets.ACADEMIC_DB_PASSWORD }}
          SCHEDULING_DB_PASSWORD: ${{ secrets.SCHEDULING_DB_PASSWORD }}
          ATTENDANCE_DB_PASSWORD: ${{ secrets.ATTENDANCE_DB_PASSWORD }}
          CONFIGURATION_DB_PASSWORD: ${{ secrets.CONFIGURATION_DB_PASSWORD }}
          QUALITY_DB_PASSWORD: ${{ secrets.QUALITY_DB_PASSWORD }}
          NOTIFICATION_DB_PASSWORD: ${{ secrets.NOTIFICATION_DB_PASSWORD }}
        run: |
          # libpq URL desde la JDBC (sin credenciales: van por PGUSER/PGPASSWORD).
          export PGUSER="$NEON_USER" PGPASSWORD="$NEON_PASSWORD"
          export PSQL="psql ${NEON_JDBC_URL#jdbc:}"
          sudo apt-get install -y -qq postgresql-client >/dev/null
          bash database/scripts/create-service-logins.sh

      - name: Limpiar contenedores
        if: always()
        working-directory: database
        run: docker compose -f docker-compose.neon.yml down --remove-orphans

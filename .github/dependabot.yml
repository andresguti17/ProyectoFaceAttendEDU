version: 2

# Politica comun a todas las entradas:
#  - mensual y como maximo 3 PRs abiertos por directorio (antes: semanal, sin limite).
#  - PRs contra develop, nunca contra main.
#  - minor y patch agrupados en un solo PR por directorio.
#  - sin saltos de version mayor (Node 20->26, TypeScript 5->7, Zod 3->4...): se
#    suben a mano, con QA, cuando el equipo lo decida.

updates:
  # -- Java (Maven) --
  - package-ecosystem: maven
    directory: /back-end/01-ms-identity
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /back-end/02-ms-authorization
    target-branch: develop

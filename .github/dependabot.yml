version: 2

# PAUSADO: open-pull-requests-limit: 0 en todas las entradas, asi que Dependabot no abre
# PRs de actualizacion de versiones. Para reactivarlo, subir ese limite (p. ej. a 3).
# Las alertas de seguridad de GitHub no dependen de este limite.
#
# Politica comun a todas las entradas:
#  - mensual; al reactivarlo, maximo 3 PRs abiertos por directorio (antes: semanal, sin limite).
#  - PRs contra develop, nunca contra main.
#  - minor y patch agrupados en un solo PR por directorio.
#  - imagenes Docker de Java (maven, eclipse-temurin), Python y Node: ignoradas por
#    completo. Cambiar de runtime (Java 21->26, Python 3.12->3.14, Node 20->26) es una
#    decision de plataforma y se hace a mano, no con un PR automatico.
#  - sin saltos de version mayor (Node 20->26, TypeScript 5->7, Zod 3->4...): se
#    suben a mano, con QA, cuando el equipo lo decida.

updates:
  # -- Java (Maven) --
  - package-ecosystem: maven
    directory: /back-end/01-ms-identity
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "build(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /back-end/02-ms-authorization

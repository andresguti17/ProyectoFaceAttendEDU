# SPA + API: el frontend es estático; /api/* va al gateway Kong.

# Cabecera Connection según si la petición pide un WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (OWASP A05). The bundle is self-hosted with no inline scripts;
    # react-native-web injects styles at runtime ('unsafe-inline' for styles only).
    # connect-src: Kong on this same host (:8000) or this origin (devtunnels / nginx
    # /api proxy), the country catalogue, and the local DigitalPersona agent.
    # Re-declared in any location that sets its own add_header (nginx does not inherit them).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' http://*:8000 https://*:8000 ws://*:8000 wss://*:8000 https://countriesnow.space https://127.0.0.1:* wss://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    server_tokens off;

    # Proxy opcional al gateway cuando el navegador usa origen relativo.
    # En producción se recomienda EXPO_PUBLIC_API_URL absoluto; esto cubre /api.
    location /api/ {
        # Soportes de justificación (PDF/JPG/PNG de hasta 5 MB, multipart).
        client_max_body_size 6m;
        proxy_pass http://kong-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: whatever the client sent would otherwise reach
        # Kong, which trusts this proxy and would take it as the client address.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Biometría (ms-biometric, fusionado desde el antiguo 10-ms-face-auth) por
    # Kong: misma ruta que usa el frontend con EXPO_PUBLIC_API_URL absoluto.
    # Los fotogramas de la prueba de vida pesan ~1 MB por petición, de ahí el
    # límite de cuerpo y el timeout más holgados que el bloque /api/ genérico.
    # WebSocket del kiosco (/api/v1/biometric/ws): sin Upgrade/Connection el
    # handshake llega al servicio como un GET normal y responde 404. Conexión
    # larga, así que el timeout de lectura es mucho mayor que el de las peticiones.
    location = /api/v1/biometric/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://kong-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: whatever the client sent would otherwise reach
        # Kong, which trusts this proxy and would take it as the client address.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/v1/biometric/ {
        client_max_body_size 10m;
        proxy_read_timeout 60s;
        proxy_pass http://kong-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: whatever the client sent would otherwise reach
        # Kong, which trusts this proxy and would take it as the client address.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"frontend-web"}';
        add_header Content-Type application/json;
    }

    # Fallback SPA para /, /login, /register, /dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# SPA + API: el frontend es estático; /api/* va al gateway Kong.

# Cabecera Connection según si la petición pide un WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy opcional al gateway cuando el navegador usa origen relativo.
    # En producción se recomienda EXPO_PUBLIC_API_URL absoluto; esto cubre /api.
    location /api/ {
        # Soportes de justificación (PDF/JPG/PNG de hasta 5 MB, multipart).
        client_max_body_size 6m;
        proxy_pass http://kong-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Biometría (ms-biometric, fusionado desde el antiguo 10-ms-face-auth) por
    # Kong: misma ruta que usa el frontend con EXPO_PUBLIC_API_URL absoluto.
    # Los fotogramas de la prueba de vida pesan ~1 MB por petición, de ahí el
    # límite de cuerpo y el timeout más holgados que el bloque /api/ genérico.
    # WebSocket del kiosco (/api/v1/biometric/ws): sin Upgrade/Connection el
    # handshake llega al servicio como un GET normal y responde 404. Conexión
    # larga, así que el timeout de lectura es mucho mayor que el de las peticiones.
    location = /api/v1/biometric/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://kong-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/biometric/ {
        client_max_body_size 10m;
        proxy_read_timeout 60s;
        proxy_pass http://kong-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"frontend-web"}';
        add_header Content-Type application/json;
    }

    # Fallback SPA para /, /login, /register, /dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }
}

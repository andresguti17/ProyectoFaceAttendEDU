# FaceAttend EDU — Producción con Neon (PostgreSQL externo)
# Incluye: Microservicios, MongoDB, Redis, Kafka, Kong, Portainer
# Las migraciones Liquibase NO van aqui: las ejecuta el job deploy-database contra Neon.
# PostgreSQL 17 corre en Neon (no local)
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
include:
  # Base y overrides en una sola entrada: Compose los fusiona antes de validar.
  # Como includes separados, el base se valida solo y falla por depender de un
  # servicio `postgres` que en producción no existe (la base está en Neon).
  - path:
      - ./back-end/docker-compose.yml
      - ./back-end/docker-compose.neon-overrides.yml

services:
  # Portainer CE — accesible solo por túnel SSH (:9443)
  portainer:
    image: portainer/portainer-ce:lts@sha256:3609c307943bca8e5c492f69ddd6965df177208b50678a4cff28391c8dd4e96e
    container_name: faceattend-portainer
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - faceattend-edge
      - faceattend-app

  # Caddy — TLS (Let's Encrypt) delante de Kong. Sirve https://$API_DOMAIN.
  caddy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    container_name: faceattend-caddy
    mem_limit: 128m
    cpus: "0.25"
    restart: unless-stopped
    depends_on:
      kong-gateway:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required (DNS name pointing to this host)}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # Fixed address: the only proxy Kong trusts for X-Forwarded-For in production.
      faceattend-edge:
        ipv4_address: 10.203.10.11

# Las redes (faceattend-edge/app/data) y los volumenes mongo_data, redis_data y
# kafka_data ya los define back-end/docker-compose.yml, que se importa arriba.
# Volver a declararlos aqui da "conflicts with imported resource" en Compose 2.40.
volumes:
  portainer_data:
  caddy_data:
  caddy_config:

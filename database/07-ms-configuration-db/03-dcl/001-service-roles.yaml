databaseChangeLog:
  - changeSet:
      id: dcl-001-service-role-configuration
      author: FaceAttendEDU
      # Re-applied on every update so tables added later are covered too (all statements are idempotent).
      runAlways: true
      comment: >-
        Data isolation per service: svc_configuration (NOLOGIN) may only read and write the configuration
        schema. The service logs in with its own user, member of this role, created by
        database/scripts/create-service-logins.sh (passwords from the environment, never here).
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'svc_configuration') THEN
                  CREATE ROLE svc_configuration NOLOGIN;
                END IF;
              END
              $$;
        - sql:
            splitStatements: true
            sql: |
              REVOKE ALL ON SCHEMA "configuration" FROM PUBLIC;
              GRANT USAGE ON SCHEMA "configuration" TO svc_configuration;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA "configuration" TO svc_configuration;
              GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA "configuration" TO svc_configuration;
              GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA "configuration" TO svc_configuration;
              ALTER DEFAULT PRIVILEGES IN SCHEMA "configuration" GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO svc_configuration;
              ALTER DEFAULT PRIVILEGES IN SCHEMA "configuration" GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO svc_configuration;
      rollback:
        - sql:
            sql: SELECT 1

databaseChangeLog:
  - changeSet:
      id: config-001-seed-security-configuration-table
      author: Andres Gutierrez
      context: seed
      splitStatements: false
      changes:
        - sql:
            sql: |
              INSERT INTO configuration.security_configuration (configuration_id, configuration_name, configuration_value, description, created_at, updated_at, row_version) VALUES
                (1, 'session_timeout_minutes', '480', 'Session max duration in minutes', NOW(), NOW(), 1),
                (2, 'max_login_attempts', '5', 'Max login attempts before lockout', NOW(), NOW(), 1),
                (3, 'lockout_duration_minutes', '30', 'Lockout duration after failed attempts', NOW(), NOW(), 1),
                (4, 'two_factor_enabled', 'false', 'Two-factor authentication enabled', NOW(), NOW(), 1)
      rollback:
        - sql:
            sql: DELETE FROM configuration.security_configuration;

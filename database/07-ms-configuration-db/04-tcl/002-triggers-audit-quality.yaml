databaseChangeLog:
  # ── Dominio Quality (09-ms-quality) ─────────────────────────────
  # `created_at`, `updated_at` y `row_version` son propiedad exclusiva de estos
  # triggers: el servicio nunca los escribe en SQL (CONVENCIONES.md §2).
  - changeSet:
      id: qual-014-create-fn-audit-timestamps-quality
      author: Andres Gutierrez
      changes:
        - sqlFile:
            path: 002-create-fn-audit-timestamps-quality.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: 002-create-fn-audit-timestamps-quality-rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: qual-015-create-triggers-audit-quality-project
      author: Andres Gutierrez
      changes:
        - sql:
            sql: |
              CREATE TRIGGER trg_audit_quality_project
              BEFORE INSERT OR UPDATE ON quality.quality_project
              FOR EACH ROW
              EXECUTE FUNCTION quality.fn_audit_timestamps();
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_audit_quality_project ON quality.quality_project;

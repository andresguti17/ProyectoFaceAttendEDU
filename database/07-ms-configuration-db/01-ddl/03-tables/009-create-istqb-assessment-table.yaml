databaseChangeLog:
  - changeSet:
      id: qual-012-create-istqb-assessment-table
      author: Andres Gutierrez
      splitStatements: false
      changes:
        - sql:
            sql: |
              CREATE TABLE quality.istqb_assessment (
                istqb_assessment_id BIGSERIAL NOT NULL,
                service_name VARCHAR(100) NOT NULL, -- Microservicio evaluado (ej. '05-ms-attendance'); sin FK, no existe registro de servicios
                evaluator_name VARCHAR(200) NOT NULL,
                assessment_scope VARCHAR(200) NOT NULL, -- Alcance evaluado (ej. 'CRUD alerts')
                project_id BIGINT NULL, -- Trazabilidad ISO/IEC 29110 SI.O2/SI.O7 con quality.quality_project
                assessment_status quality.evaluation_status NOT NULL DEFAULT 'Draft',
                comments TEXT NULL,
                global_score DECIMAL(4,2) NULL, -- Puntaje global ponderado 1-5 (derivado de istqb_assessment_item)
                percentage DECIMAL(5,1) NULL, -- global_score / 5 * 100
                quality_level quality.quality_level NULL, -- Nivel derivado de global_score
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP NULL,
                deleted_at TIMESTAMP NULL,
                created_by UUID NULL, -- Cross-context reference to Identity.app_user (NO FK)
                updated_by UUID NULL, -- Cross-context reference to Identity.app_user (NO FK)
                deleted_by UUID NULL, -- Cross-context reference to Identity.app_user (NO FK)
                row_version BIGINT NOT NULL DEFAULT 1,
                CONSTRAINT istqb_assessment_pkey PRIMARY KEY (istqb_assessment_id)
              )
        - createIndex:
            schemaName: quality
            tableName: istqb_assessment
            indexName: idx_istqb_assessment_service
            columns:
              - column:
                  name: service_name
        - createIndex:
            schemaName: quality
            tableName: istqb_assessment
            indexName: idx_istqb_assessment_status
            columns:
              - column:
                  name: assessment_status
        - createIndex:
            schemaName: quality
            tableName: istqb_assessment
            indexName: idx_istqb_assessment_project
            columns:
              - column:
                  name: project_id
        - createIndex:
            schemaName: quality
            tableName: istqb_assessment
            indexName: idx_istqb_assessment_deleted
            columns:
              - column:
                  name: deleted_at
        - sql:
            sql: ALTER TABLE quality.istqb_assessment ADD CONSTRAINT fk_istqb_assessment_project FOREIGN KEY (project_id) REFERENCES quality.quality_project (project_id) ON DELETE SET NULL
      rollback:
        - dropTable:
            schemaName: quality
            tableName: istqb_assessment

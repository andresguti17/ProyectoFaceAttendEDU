databaseChangeLog:
  - changeSet:
      id: config-006-enforce-updated-at-not-null
      author: Andres Gutierrez
      changes:
        - sql:
            sql: |
              UPDATE configuration.academic_configuration SET updated_at = COALESCE(updated_at, created_at, now()) WHERE updated_at IS NULL;
              ALTER TABLE configuration.academic_configuration ALTER COLUMN updated_at SET NOT NULL;
        - sql:
            sql: |
              UPDATE configuration.security_configuration SET updated_at = COALESCE(updated_at, created_at, now()) WHERE updated_at IS NULL;

databaseChangeLog:
  - changeSet:
      id: sched-002-fix-fn-audit-timestamps-insert
      author: Andres Gutierrez
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION scheduling.fn_audit_timestamps()
              RETURNS TRIGGER AS $$
              BEGIN
                IF TG_OP = 'INSERT' THEN
                  NEW.created_at = COALESCE(NEW.created_at, now());
                  NEW.updated_at = COALESCE(NEW.updated_at, now());
                  NEW.row_version = COALESCE(NEW.row_version, 1);
                  RETURN NEW;
                ELSIF TG_OP = 'UPDATE' THEN
                  NEW.updated_at = now();
                  NEW.row_version = COALESCE(NEW.row_version, 1) + 1;
                  RETURN NEW;
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION scheduling.fn_audit_timestamps()
              RETURNS TRIGGER AS $$
              BEGIN
                IF TG_OP = 'INSERT' THEN
                  NEW.created_at = COALESCE(NEW.created_at, now());
                  NEW.row_version = COALESCE(NEW.row_version, 1);
                  RETURN NEW;
                ELSIF TG_OP = 'UPDATE' THEN
                  NEW.updated_at = now();
                  NEW.row_version = COALESCE(NEW.row_version, 1) + 1;
                  RETURN NEW;
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

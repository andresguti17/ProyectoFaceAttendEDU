databaseChangeLog:
  - changeSet:
      id: acad-001-create-fn-audit-timestamps
      author: Andres Gutierrez
      changes:
        - sqlFile:
            path: 001-create-fn-audit-timestamps.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: 001-create-fn-audit-timestamps-rollback.sql
            relativeToChangelogFile: true
            splitStatements: false

  - changeSet:
      id: acad-002-create-trigger-school-audit
      author: Andres Gutierrez
      changes:
        - sql:
            sql: >
              CREATE TRIGGER trg_school_audit_timestamps
              BEFORE INSERT OR UPDATE ON academic.school
              FOR EACH ROW
              EXECUTE FUNCTION academic.fn_audit_timestamps();
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_school_audit_timestamps ON academic.school;


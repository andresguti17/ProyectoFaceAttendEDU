databaseChangeLog:
  - changeSet:
      id: acad-007-create-academic-actor-table
      author: Andres Gutierrez
      changes:
        - createTable:
            schemaName: academic
            tableName: academic_actor
            columns:
              - column:
                  name: academic_actor_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: person_id
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: "Cross-context reference to Identity.person (NO FK)"
              - column:
                  name: actor_type_id
                  type: SMALLINT
                  constraints:
                    nullable: false
              - column:
                  name: school_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: actor_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                  remarks: "Codigo de aprendiz o instructor"
              - column:
                  name: started_on
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: ended_on
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: deleted_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: row_version
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE academic.academic_actor ADD CONSTRAINT uq_actor_code_school_type UNIQUE (school_id, actor_type_id, actor_code)
        - sql:
            sql: ALTER TABLE academic.academic_actor ADD CONSTRAINT uq_actor_person_type_school UNIQUE (person_id, actor_type_id, school_id)
        - createIndex:
            indexName: idx_actor_deleted
            schemaName: academic
            tableName: academic_actor
            columns:
              - column:
                  name: deleted_at
        - sql:
            sql: ALTER TABLE academic.academic_actor ADD CONSTRAINT fk_actor_actor_type FOREIGN KEY (actor_type_id) REFERENCES academic.academic_actor_type (actor_type_id)
        - sql:
            sql: ALTER TABLE academic.academic_actor ADD CONSTRAINT fk_actor_school FOREIGN KEY (school_id) REFERENCES academic.school (school_id) ON DELETE CASCADE
      rollback:
        - dropTable:
            schemaName: academic
            tableName: academic_actor

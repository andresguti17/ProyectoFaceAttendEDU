databaseChangeLog:
  - changeSet:
      id: acad-004-create-cohort-table
      author: Andres Gutierrez
      changes:
        - createTable:
            schemaName: academic
            tableName: cohort
            columns:
              - column:
                  name: cohort_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: program_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: academic_period_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: deleted_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: row_version
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE academic.cohort ADD CONSTRAINT fk_cohort_program FOREIGN KEY (program_id) REFERENCES academic.program (program_id) ON DELETE CASCADE
        - sql:
            sql: ALTER TABLE academic.cohort ADD CONSTRAINT fk_cohort_academic_period FOREIGN KEY (academic_period_id) REFERENCES academic.academic_period (academic_period_id) ON DELETE CASCADE
      rollback:
        - dropTable:
            schemaName: academic
            tableName: cohort

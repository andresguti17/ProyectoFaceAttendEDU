databaseChangeLog:
  - changeSet:
      id: dcl-001-service-role-academic
      author: FaceAttendEDU
      # Re-applied on every update so tables added later are covered too (all statements are idempotent).
      runAlways: true
      comment: >-
        Data isolation per service: svc_academic (NOLOGIN) may only read and write the academic
        schema. The service logs in with its own user, member of this role, created by
        database/scripts/create-service-logins.sh (passwords from the environment, never here).
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'svc_academic') THEN
                  CREATE ROLE svc_academic NOLOGIN;
                END IF;
              END
              $$;
        - sql:
            splitStatements: true
            sql: |
              REVOKE ALL ON SCHEMA "academic" FROM PUBLIC;
              GRANT USAGE ON SCHEMA "academic" TO svc_academic;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA "academic" TO svc_academic;
              GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA "academic" TO svc_academic;
              GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA "academic" TO svc_academic;
              ALTER DEFAULT PRIVILEGES IN SCHEMA "academic" GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO svc_academic;
              ALTER DEFAULT PRIVILEGES IN SCHEMA "academic" GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO svc_academic;
      rollback:
        - sql:
            sql: SELECT 1

databaseChangeLog:
  - changeSet:
      id: id-001-create-audit-timestamps-function
      author: Andres Gutierrez
      changes:
        - sqlFile:
            path: 001-create-audit-timestamps-function.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: 001-create-audit-timestamps-function-rollback.sql
            relativeToChangelogFile: true
            splitStatements: false

  - changeSet:
      id: id-002-create-trigger-city
      author: Andres Gutierrez
      changes:
        - sql:
            sql: |
              CREATE TRIGGER trg_city_audit_timestamps
              BEFORE INSERT OR UPDATE ON identity.city
              FOR EACH ROW
              EXECUTE FUNCTION identity.fn_audit_timestamps();
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_city_audit_timestamps ON identity.city;


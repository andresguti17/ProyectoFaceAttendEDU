databaseChangeLog:
  - changeSet:
      id: id-001-seed-password-policy-table
      author: Andres Gutierrez
      context: seed
      # Accepts the original checksum too: on machines where this seed already
      # ran, `valueDate: { dateFunction: now }` silently inserted NULLs.
      validCheckSum: any
      changes:
        - insert:
            schemaName: identity
            tableName: password_policy
            columns:
              - column: { name: policy_id, value: 1 }
              - column: { name: min_length, value: 8 }
              - column: { name: max_length, value: 20 }
              - column: { name: requires_uppercase, value: true }
              - column: { name: requires_numbers, value: true }
              - column: { name: requires_symbols, value: true }
              - column: { name: expiration_days, value: 90 }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: row_version, value: 1 }

databaseChangeLog:
  - changeSet:
      id: id-001-bootstrap-admin-user
      author: FaceAttendEDU
      context: seed
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE EXTENSION IF NOT EXISTS pgcrypto;
              INSERT INTO "identity".person (person_id, document_number, name, last_name, email, status, created_at, row_version) VALUES
                ('11111111-1111-4111-8111-111111111111', 'ADMIN-001', 'Admin', 'FaceAttend', 'admin@faceattend.local', TRUE, NOW(), 1)
              ON CONFLICT (person_id) DO NOTHING;
              INSERT INTO "identity".app_user (user_id, person_id, username, password_hash, authentication_type, status, created_at, row_version) VALUES
                ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111', 'admin.faceattend', crypt('Admin123!ChangeMe', gen_salt('bf', 12)), 'Local', TRUE, NOW(), 1)
              ON CONFLICT (user_id) DO NOTHING;
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DELETE FROM "identity".app_user WHERE user_id = '22222222-2222-4222-8222-222222222222';
              DELETE FROM "identity".person WHERE person_id = '11111111-1111-4111-8111-111111111111';

databaseChangeLog:
  - changeSet:
      id: id-005-create-password-policy-table
      author: Andres Gutierrez
      changes:
        - createTable:
            schemaName: identity
            tableName: password_policy
            columns:
              - column:
                  name: policy_id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: min_length
                  type: INT
                  defaultValueNumeric: 8
                  constraints:
                    nullable: false
              - column:
                  name: max_length
                  type: INT
                  defaultValueNumeric: 20
                  constraints:
                    nullable: false
              - column:
                  name: requires_uppercase
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: requires_numbers
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: requires_symbols
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: expiration_days
                  type: INT
                  defaultValueNumeric: 90
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: deleted_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: row_version
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE identity.password_policy ALTER COLUMN policy_id ADD GENERATED BY DEFAULT AS IDENTITY;
        - sql:
            sql: ALTER TABLE identity.password_policy ADD CONSTRAINT chk_password_lengths CHECK (min_length <= max_length AND min_length >= 4)
      rollback:
        - dropTable:
            schemaName: identity
            tableName: password_policy

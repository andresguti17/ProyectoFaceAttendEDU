databaseChangeLog:
  - changeSet:
      id: id-004-create-user-session-table
      author: Andres Gutierrez
      splitStatements: false
      changes:
        - sql:
            sql: |
              CREATE TABLE identity.user_session (
                session_id UUID NOT NULL,
                user_id UUID NOT NULL,
                start_date TIMESTAMP NOT NULL,
                end_date TIMESTAMP NULL,
                source_ip VARCHAR(45) NULL,
                session_status identity.user_session_status NOT NULL DEFAULT 'Active',
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                deleted_at TIMESTAMP NULL,
                created_by UUID NULL,
                updated_by UUID NULL,
                deleted_by UUID NULL,
                row_version BIGINT NOT NULL DEFAULT 1,
                CONSTRAINT user_session_pkey PRIMARY KEY (session_id)
              )
        - createIndex:
            schemaName: identity
            tableName: user_session
            indexName: idx_session_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            schemaName: identity
            tableName: user_session
            indexName: idx_session_status
            columns:
              - column:
                  name: session_status
        - sql:
            sql: ALTER TABLE identity.user_session ADD CONSTRAINT fk_user_session_app_user FOREIGN KEY (user_id) REFERENCES identity.app_user (user_id) ON DELETE CASCADE
      rollback:
        - dropTable:
            schemaName: identity
            tableName: user_session

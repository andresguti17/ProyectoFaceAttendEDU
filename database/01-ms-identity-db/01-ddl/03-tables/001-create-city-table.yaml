databaseChangeLog:
  - changeSet:
      id: id-001-create-city-table
      author: Andres Gutierrez
      changes:
        - createTable:
            schemaName: identity
            tableName: city
            columns:
              - column:
                  name: city_id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: department
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
                  remarks: "Departamento / estado al que pertenece la ciudad"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: updated_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: deleted_by
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: row_version
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE identity.city ALTER COLUMN city_id ADD GENERATED BY DEFAULT AS IDENTITY;
        - createIndex:
            schemaName: identity
            tableName: city
            indexName: idx_city_name
            columns:
              - column:
                  name: name
      rollback:
        - dropTable:
            schemaName: identity
            tableName: city

databaseChangeLog:
  - changeSet:
      id: id-011-add-app-user-must-change-password
      author: Andres Gutierrez
      splitStatements: false
      comment: true cuando las credenciales iniciales se entregaron por correo; se apaga al cambiar la contraseña.
      changes:
        - sql:
            sql: ALTER TABLE identity.app_user ADD COLUMN IF NOT EXISTS must_change_password BOOLEAN NOT NULL DEFAULT FALSE;
      rollback:
        - sql:
            sql: ALTER TABLE identity.app_user DROP COLUMN IF EXISTS must_change_password;

    container_name: faceattend-scheduling-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      academic-liquibase:
        condition: service_completed_successfully
    environment:
      LIQUIBASE_URL: ${NEON_JDBC_URL}
      LIQUIBASE_USERNAME: ${NEON_USER}
      LIQUIBASE_PASSWORD: ${NEON_PASSWORD}

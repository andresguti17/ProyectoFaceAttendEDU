# FaceAttend EDU — Liquibase migrations against Neon PostgreSQL (external)
# Database runs in Neon; this file only orchestrates schema migrations.
# Use with: docker compose -f docker-compose.prod.yml up

services:
  identity-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0}
    container_name: faceattend-identity-liquibase
    mem_limit: 256m
    cpus: "0.5"
    environment:
      # Neon connection string (env vars from .env)
      LIQUIBASE_URL: ${NEON_JDBC_URL}
      LIQUIBASE_USERNAME: ${NEON_USER}
      LIQUIBASE_PASSWORD: ${NEON_PASSWORD}
    volumes:
      - ./01-ms-identity-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=${NEON_JDBC_URL}
      - --username=${NEON_USER}
      - --password=${NEON_PASSWORD}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - faceattend-data

  authorization-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0}
    container_name: faceattend-authorization-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      identity-liquibase:
        condition: service_completed_successfully
    environment:
      LIQUIBASE_URL: ${NEON_JDBC_URL}
      LIQUIBASE_USERNAME: ${NEON_USER}
      LIQUIBASE_PASSWORD: ${NEON_PASSWORD}
    volumes:
      - ./02-ms-authorization-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=${NEON_JDBC_URL}
      - --username=${NEON_USER}
      - --password=${NEON_PASSWORD}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - faceattend-data

  academic-liquibase:
    image: ${FACEATTEND_LIQUIBASE_IMAGE:-liquibase/liquibase:4.29.0}
    container_name: faceattend-academic-liquibase
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      authorization-liquibase:
        condition: service_completed_successfully
    environment:
      LIQUIBASE_URL: ${NEON_JDBC_URL}
      LIQUIBASE_USERNAME: ${NEON_USER}
      LIQUIBASE_PASSWORD: ${NEON_PASSWORD}
    volumes:
      - ./03-ms-academic-db:/liquibase/project
    command:
      - --searchPath=/liquibase/project
      - --url=${NEON_JDBC_URL}
      - --username=${NEON_USER}
      - --password=${NEON_PASSWORD}
      - --changeLogFile=changelog/changelog-master.yaml
      - update
    networks:
      - faceattend-data

  scheduling-liquibase:

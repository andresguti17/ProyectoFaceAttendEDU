databaseChangeLog:
  - changeSet:
      id: notif-001-seed-alert-type-table
      author: Andres Gutierrez
      context: seed
      splitStatements: false
      preConditions:
        - onFail: MARK_RAN
        - rowCount:
            schemaName: notification
            tableName: alert_type
            expectedRows: 0
      changes:
        - sql:
            sql: |
              INSERT INTO notification.alert_type (alert_type_id, code, name, severity, channel, created_at, updated_at, row_version) VALUES
                (1, 'ATTENDANCE_ABSENTEEISM', 'Recurrent absenteeism', 'WARNING', 'DASHBOARD', NOW(), NOW(), 1),
                (2, 'ATTENDANCE_TARDINESS', 'Repeated tardiness', 'WARNING', 'DASHBOARD', NOW(), NOW(), 1),
                (3, 'ATTENDANCE_LOW', 'Low attendance rate', 'CRITICAL', 'EMAIL', NOW(), NOW(), 1),
                (4, 'JUSTIFICATION_PENDING', 'Pending justification review', 'INFO', 'DASHBOARD', NOW(), NOW(), 1),
                (5, 'BIOMETRIC_UPDATE', 'Biometric update request', 'INFO', 'PUSH', NOW(), NOW(), 1)
      rollback:
        - sql:
            sql: DELETE FROM notification.alert_type;

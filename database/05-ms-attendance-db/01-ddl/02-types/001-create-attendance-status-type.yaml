databaseChangeLog:
  - changeSet:
      id: att-001-create-attendance-status-type
      author: Andres Gutierrez
      splitStatements: false
      changes:
        - sql:
            sql: |
              CREATE TYPE attendance.attendance_status AS ENUM ('Present', 'Absent', 'Late', 'Justified')
      rollback:
        - sql:
            sql: DROP TYPE IF EXISTS attendance.attendance_status

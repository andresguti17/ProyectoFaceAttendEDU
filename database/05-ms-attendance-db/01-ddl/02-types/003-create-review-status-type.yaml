databaseChangeLog:
  - changeSet:
      id: att-003-create-review-status-type
      author: Andres Gutierrez
      splitStatements: false
      changes:
        - sql:
            sql: |
              CREATE TYPE attendance.review_status AS ENUM ('Pending', 'Approved', 'Rejected')
      rollback:
        - sql:
            sql: DROP TYPE IF EXISTS attendance.review_status

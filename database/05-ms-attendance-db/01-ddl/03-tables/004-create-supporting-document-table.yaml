databaseChangeLog:
  - changeSet:
      id: att-007-create-supporting-document-table
      author: Andres Gutierrez
      changes:
        - createTable:
            schemaName: attendance
            tableName: supporting_document
            columns:
              - column:
                  name: supporting_document_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: justification_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: attendance.justification(justification_id)
                    foreignKeyName: fk_document_justification
                    deleteCascade: true
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: storage_uri
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: mime_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: deleted_by
                  type: UUID
              - column:
                  name: row_version
                  type: BIGINT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: attendance
            tableName: supporting_document
            indexName: idx_document_justification
            columns:
              - column:
                  name: justification_id
        - sql:
            sql: ALTER TABLE attendance.supporting_document ADD CONSTRAINT chk_size_bytes CHECK (size_bytes > 0)
      rollback:
        - dropTable:
            schemaName: attendance
            tableName: supporting_document

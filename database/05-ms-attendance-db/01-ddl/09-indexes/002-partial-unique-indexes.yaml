databaseChangeLog:
  - changeSet:
      id: att-partial-unique-indexes
      author: Andres Gutierrez
      comment: >-
        Unique keys become partial (WHERE deleted_at IS NULL): rows are only ever soft-deleted, so a
        full unique index kept a deleted row's key reserved and re-creating or re-enrolling the same
        thing failed with a unique violation. Existing live rows are already unique, so nothing conflicts.
      changes:
        - sql:
            sql: ALTER TABLE attendance.attendance_record DROP CONSTRAINT IF EXISTS uq_attendance_session_actor
        - sql:
            sql: DROP INDEX IF EXISTS attendance.uq_attendance_session_actor
        - sql:
            sql: CREATE UNIQUE INDEX uq_attendance_session_actor ON attendance.attendance_record (class_session_id, academic_actor_id) WHERE deleted_at IS NULL
        - sql:
            sql: ALTER TABLE attendance.justification DROP CONSTRAINT IF EXISTS uq_justification_attendance_record
        - sql:
            sql: DROP INDEX IF EXISTS attendance.uq_justification_attendance_record
        - sql:
            sql: CREATE UNIQUE INDEX uq_justification_attendance_record ON attendance.justification (attendance_record_id) WHERE deleted_at IS NULL
        - sql:
            sql: ALTER TABLE attendance.justification_type DROP CONSTRAINT IF EXISTS uq_justification_type_school_name
        - sql:
            sql: DROP INDEX IF EXISTS attendance.uq_justification_type_school_name
        - sql:
            sql: CREATE UNIQUE INDEX uq_justification_type_school_name ON attendance.justification_type (school_id, name) WHERE deleted_at IS NULL
        - sql:
            sql: ALTER TABLE attendance.justification_type DROP CONSTRAINT IF EXISTS uq_justification_type_global_name
        - sql:
            sql: DROP INDEX IF EXISTS attendance.uq_justification_type_global_name
        - sql:
            sql: CREATE UNIQUE INDEX uq_justification_type_global_name ON attendance.justification_type (name) WHERE school_id IS NULL AND deleted_at IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS attendance.uq_attendance_session_actor
        - sql:
            sql: ALTER TABLE attendance.attendance_record ADD CONSTRAINT uq_attendance_session_actor UNIQUE (class_session_id, academic_actor_id)
        - sql:
            sql: DROP INDEX IF EXISTS attendance.uq_justification_attendance_record
        - sql:
            sql: ALTER TABLE attendance.justification ADD CONSTRAINT uq_justification_attendance_record UNIQUE (attendance_record_id)
        - sql:
            sql: DROP INDEX IF EXISTS attendance.uq_justification_type_school_name
        - sql:
            sql: ALTER TABLE attendance.justification_type ADD CONSTRAINT uq_justification_type_school_name UNIQUE (school_id, name)
        - sql:
            sql: DROP INDEX IF EXISTS attendance.uq_justification_type_global_name
        - sql:
            sql: CREATE UNIQUE INDEX uq_justification_type_global_name ON attendance.justification_type (name) WHERE school_id IS NULL

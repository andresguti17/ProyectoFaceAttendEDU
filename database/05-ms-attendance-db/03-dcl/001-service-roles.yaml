databaseChangeLog:
  - changeSet:
      id: dcl-001-service-role-attendance
      author: FaceAttendEDU
      # Re-applied on every update so tables added later are covered too (all statements are idempotent).
      runAlways: true
      comment: >-
        Data isolation per service: svc_attendance (NOLOGIN) may only read and write the attendance
        schema. The service logs in with its own user, member of this role, created by
        database/scripts/create-service-logins.sh (passwords from the environment, never here).
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'svc_attendance') THEN
                  CREATE ROLE svc_attendance NOLOGIN;
                END IF;
              END
              $$;
        - sql:
            splitStatements: true
            sql: |
              REVOKE ALL ON SCHEMA "attendance" FROM PUBLIC;
              GRANT USAGE ON SCHEMA "attendance" TO svc_attendance;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA "attendance" TO svc_attendance;
              GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA "attendance" TO svc_attendance;
              GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA "attendance" TO svc_attendance;
              ALTER DEFAULT PRIVILEGES IN SCHEMA "attendance" GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO svc_attendance;
              ALTER DEFAULT PRIVILEGES IN SCHEMA "attendance" GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO svc_attendance;
      rollback:
        - sql:
            sql: SELECT 1
